[package]
name = "parsec-edgar-bench"
description = "Accuracy benchmark for parsec-edgar Item section extraction"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "parsec-edgar-bench"
path = "src/main.rs"

[dependencies]
parsec-edgar = { path = "../crates/parsec-edgar" }
clap = { version = "4.6", features = ["derive", "env"] }
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
