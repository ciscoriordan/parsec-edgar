[package]
name = "parsec-edgar-cli"
description = "Command-line client for SEC EDGAR: companies, filings, clean text and Item sections as JSON, plus an MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["sec", "edgar", "mcp", "cli", "finance"]
categories = ["command-line-utilities", "finance"]
rust-version.workspace = true

[[bin]]
name = "parsec-edgar"
path = "src/main.rs"

[dependencies]
parsec-edgar = { path = "../parsec-edgar", version = "0.1.0" }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3.9", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net", "signal", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
