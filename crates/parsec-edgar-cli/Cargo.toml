[package]
name = "parsec-edgar-cli"
description = "Command-line client for SEC EDGAR: companies, filings, clean text and Item sections as JSON"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "parsec-edgar"
path = "src/main.rs"

[dependencies]
parsec-edgar = { path = "../parsec-edgar", version = "0.1.0" }
clap = { version = "4.6", features = ["derive", "env"] }
serde = "1"
serde_json = "1"
