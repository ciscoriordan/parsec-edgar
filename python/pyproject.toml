[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "parsec-edgar"
description = "Fast SEC EDGAR client and filing parser written in Rust: companies, filings, clean text and 10-K/10-Q/8-K Item sections"
requires-python = ">=3.10"
license = "MIT"
keywords = ["sec", "edgar", "10-k", "filings", "finance"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial",
]
dynamic = ["version"]

[tool.maturin]
python-source = "pysrc"
module-name = "parsec_edgar._core"
